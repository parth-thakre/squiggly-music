# Builds release packages and publishes a GitHub Release.
# - Push a tag `v<package.json version>` (made by `npm version`) to build and publish.
# - Run manually (workflow_dispatch) to build and download the packages as workflow
#   artifacts without publishing anything. Only tag builds are signed, so a manual run's Windows
#   files are for testing only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Every Windows signature must be from a certificate with exactly this subject. The default is
  # SignPath Foundation's certificate; the SIGNPATH_EXPECTED_SUBJECT variable overrides it.
  SIGNPATH_EXPECTED_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SUBJECT || 'CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US' }}

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-24.04
    # Fedora provides mpv-libs, so the native libmpv decoding test runs instead of skipping.
    # Both Fedora jobs pin the image by digest. To update it, take the digest from
    # `skopeo inspect --format "{{.Digest}}" docker://docker.io/library/fedora:44`.
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # fedora:44
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Install system packages
        run: dnf -y install git-core tar zstd mpv-libs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Cut releases with npm version."
            exit 1
          fi
      # Installed copies only accept an update signed by the publisher in electron-builder.yml
      # (win.signtoolOptions.publisherName), so a release can't ship unsigned Windows files.
      - name: Check Windows signing is set up
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -z "$ORGANIZATION_ID" ]; then
            echo "::error::Releases must be signed, and the SIGNPATH_ORGANIZATION_ID variable isn't set. See docs/signing.md."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      # tests/native.test.ts forks the compiled audio host (out/main/player.js), so build first.
      - run: npm run build
      - run: npm run test:source
        env:
          SQUIGGLY_LIBMPV_PATH: /usr/lib64/libmpv.so.2

  # Playwright UI tests. They run on the Ubuntu runner, not the Fedora container, because
  # `playwright install --with-deps` installs browser dependencies with apt. Every step is
  # skipped until package.json has a test:ui script.
  ui:
    name: UI tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          CI: '1'
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the audio-only LGPL libmpv-2.dll and its corresponding-source bundle from the
  # pinned recipe in build/libmpv (see licenses/libmpv-windows/NOTICE.md). The output is
  # cached by the recipe's contents; on a cache hit build.mjs only re-verifies it. The
  # build is reproducible, and build.mjs fails unless the DLL matches the SHA-256 pinned in
  # build/libmpv/sources.json.
  libmpv:
    name: Windows libmpv (LGPL, from source)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache the libmpv build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/libmpv-windows
          key: libmpv-windows-${{ hashFiles('build/libmpv/**', 'scripts/fetch-common.mjs') }}
      # build.mjs uses only Node's standard library, so no npm ci. It runs the build in a
      # container with no network, after checking every source tarball's SHA-256.
      - name: Build or verify libmpv
        run: node build/libmpv/build.mjs
        env:
          SQUIGGLY_CONTAINER_ENGINE: docker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libmpv-windows
          path: .local/libmpv-windows/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux packages
    needs: [check, ui]
    runs-on: ubuntu-24.04
    # rpmbuild, and libcrypt.so.1 for electron-builder's bundled fpm (RPM and deb), come from
    # Fedora packages. binutils has ar, to unpack the deb.
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # fedora:44
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Install system packages
        run: dnf -y install git-core tar zstd xz rpm-build libxcrypt-compat binutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Caches only the downloaded archives. The fetch script rehashes them against the
      # digests pinned in the script on every run and rebuilds .local/linux-runtime from them.
      - name: Cache runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/downloads
          key: linux-downloads-${{ hashFiles('scripts/fetch-linux-runtime.mjs', 'scripts/fetch-common.mjs') }}
      # Published builds never carry diagnostics (docs/packaging.md, "Diagnostics builds").
      - name: No diagnostics in releases
        shell: bash
        run: |
          if [ -n "${SQUIGGLY_DIAG_URL:-}${SQUIGGLY_DIAG_TOKEN:-}" ]; then
            echo "::error::Releases are built without diagnostics. SQUIGGLY_DIAG_URL and SQUIGGLY_DIAG_TOKEN must not be set."
            exit 1
          fi
      - run: npm ci
      - run: npm run package:linux
      # Installs the RPM the way users do, so dnf resolves mpv-libs from its Requires, then
      # runs the installed audio host with its bundled Node against the system libmpv.
      - name: Install the RPM and smoke-test its audio runtime
        run: |
          dnf -y install ./dist/squiggly-music-*.x86_64.rpm
          "/opt/Squiggly Music/resources/runtime/node" scripts/smoke-runtime.mjs "/opt/Squiggly Music" --expect-system-libmpv
      # The deb and the AppImage, unpacked, against the mpv-libs the RPM brought in. Neither may
      # bundle libmpv, and each must carry its notices.
      - name: Unpack the deb and the AppImage and smoke-test their audio runtimes
        run: |
          mkdir -p "$RUNNER_TEMP/deb" "$RUNNER_TEMP/appimage"
          (cd "$RUNNER_TEMP/deb" && ar x "$GITHUB_WORKSPACE"/dist/squiggly-music_*_amd64.deb && tar -xf data.tar.xz)
          (cd "$RUNNER_TEMP/appimage" && "$GITHUB_WORKSPACE"/dist/Squiggly-Music-*-x86_64.AppImage --appimage-extract > /dev/null)
          for tree in "$RUNNER_TEMP/deb/opt/Squiggly Music" "$RUNNER_TEMP/appimage/squashfs-root"; do
            "$tree/resources/runtime/node" scripts/smoke-runtime.mjs "$tree" --expect-system-libmpv
            node scripts/release-notices.mjs "$tree" linux
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  # Windows signing goes through SignPath Foundation (CODE_SIGNING.md, docs/signing.md). Release
  # tags (v*) are always signed, and check fails a tag if signing isn't set up. A manual run from a
  # branch builds unsigned files, for testing only: installed copies won't update to them.
  # Each signing request waits for an approver.
  # A signed release takes five jobs, so the SignPath token never reaches a runner that ran npm ci
  # or this repository's code: windows builds the app, windows-sign-app signs it,
  # windows-installers builds the installer and portable exe from the signed app,
  # windows-sign-installers signs those, and windows-release updates latest.yml and checks every
  # signature. The two signing jobs check nothing out; they only pass files to SignPath and back.
  windows:
    name: Windows installer and portable
    needs: [check, ui, libmpv]
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      unsigned-app: ${{ steps.unsigned-app.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Caches only the downloaded archives. The fetch script rehashes them against the
      # digests pinned in the script on every run and rebuilds .local/windows-runtime from them.
      - name: Cache runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/downloads
          key: windows-downloads-${{ hashFiles('scripts/fetch-windows-runtime.mjs', 'scripts/fetch-common.mjs') }}
      # fetch-windows-runtime.mjs checks this build against build/libmpv before packaging it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libmpv-windows
          path: .local/libmpv-windows
      - name: No diagnostics in releases
        shell: bash
        run: |
          if [ -n "${SQUIGGLY_DIAG_URL:-}${SQUIGGLY_DIAG_TOKEN:-}" ]; then
            echo "::error::Releases are built without diagnostics. SQUIGGLY_DIAG_URL and SQUIGGLY_DIAG_TOKEN must not be set."
            exit 1
          fi
      - run: npm ci
      # The app first, so its own files are signed before they go into the installers. This builds
      # the installers too, and a signed release rebuilds them from the signed app: electron-builder
      # only writes resources/app-update.yml, which the updater reads, when it builds the NSIS
      # installer, not for --dir or --prepackaged.
      - name: Build the app
        run: npm run package:win
      # Runs the packaged audio host with the bundled node.exe, Koffi binary, and libmpv-2.dll,
      # and the unpacked esbuild binary.
      - name: Smoke-test the packaged audio runtime
        run: node scripts/smoke-runtime.mjs dist/win-unpacked
      # Unsigned builds ship these files as they are; a signed release uploads them from windows-release.
      - if: env.SIGN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
      # Signs the files this project builds: the app's exe and libmpv-2.dll. node.exe is signed
      # by the OpenJS Foundation; other third-party files are left as they came.
      - name: Upload the app for signing
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-app-unsigned
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 1

  windows-sign-app:
    name: Sign the Windows app
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # SignPath reads this run's jobs to verify where the files came from, and downloads them
    # Up to an hour waiting for approval.
    timeout-minutes: 70
    steps:
      - name: Check the SignPath token is set
        env:
          TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::Releases must be signed, and the SIGNPATH_API_TOKEN secret isn't set. See docs/signing.md."
            exit 1
          fi
      - name: Sign the app
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: squiggly-music
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ needs.windows.outputs.unsigned-app }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-app-signed
          path: signed-app/
          if-no-files-found: error
          retention-days: 1

  windows-installers:
    name: Windows installer and portable, from the signed app
    needs: windows-sign-app
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      unsigned-installers: ${{ steps.unsigned-installers.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-app-signed
          path: dist/win-unpacked
      - name: Check the app's signatures
        shell: pwsh
        run: |
          foreach ($file in Get-Item 'dist/win-unpacked/Squiggly Music.exe', 'dist/win-unpacked/resources/runtime/libmpv-2.dll') {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($signature.Status)" }
            $subject = $signature.SignerCertificate.Subject
            if ($subject -cne $env:SIGNPATH_EXPECTED_SUBJECT) { throw "$($file.Name) is signed by '$subject', not '$env:SIGNPATH_EXPECTED_SUBJECT'" }
            "$($file.Name): $subject"
          }
      # Installed copies only accept an update signed by a publisher named in app-update.yml.
      - name: Check the updater will accept this certificate
        shell: pwsh
        run: |
          $certificate = (Get-AuthenticodeSignature -LiteralPath 'dist/win-unpacked/Squiggly Music.exe').SignerCertificate
          $publisher = $certificate.GetNameInfo('SimpleName', $false)
          $config = Get-Content -Raw -LiteralPath 'dist/win-unpacked/resources/app-update.yml'
          if ($config -notmatch "(?m)^\s*-\s*$([regex]::Escape($publisher))\s*$") { throw "app-update.yml doesn't name $publisher as a publisher, so installed copies would refuse this release as an update" }
          "app-update.yml names $publisher"
      - name: Build the installer and portable exe
        run: npx electron-builder --win --prepackaged dist/win-unpacked --publish never
      - name: Upload the installer and portable exe for signing
        id: unsigned-installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installers-unsigned
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-update-metadata
          path: dist/latest.yml
          if-no-files-found: error
          retention-days: 1

  windows-sign-installers:
    name: Sign the Windows installer and portable
    needs: windows-installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # SignPath reads this run's jobs to verify where the files came from, and downloads them
    # Up to an hour waiting for approval.
    timeout-minutes: 70
    steps:
      - name: Sign the installer and portable exe
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: squiggly-music
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ needs.windows-installers.outputs.unsigned-installers }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installers-signed
          path: signed-installers/
          if-no-files-found: error
          retention-days: 1

  windows-release:
    name: Windows release files
    needs: windows-sign-installers
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # scripts/rehash-windows-update.mjs uses electron-builder's block map code.
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-update-metadata
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installers-signed
          path: dist
      # Signing changes the installer's bytes, so latest.yml and its block map are rebuilt.
      - name: Update the installer's metadata
        run: node scripts/rehash-windows-update.mjs dist
      - name: Check the signatures
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist/*.exe) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($signature.Status)" }
            $subject = $signature.SignerCertificate.Subject
            if ($subject -cne $env:SIGNPATH_EXPECTED_SUBJECT) { throw "$($file.Name) is signed by '$subject', not '$env:SIGNPATH_EXPECTED_SUBJECT'" }
            "$($file.Name): $subject"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  # linux and windows each fail before uploading if their packaged smoke test fails, so
  # assemble and publish only run on packages whose audio runtime started and decoded audio.
  # windows-release only runs for a release tag; a manual run takes the unsigned files from windows.
  # A tag never gets this far without windows-release.
  assemble:
    name: Collect assets and checksums
    needs: [linux, windows, windows-release, libmpv]
    if: >-
      !cancelled() && !failure()
      && (needs.windows-release.result == 'success' || !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-x64'
          path: release
          merge-multiple: true
      # The LGPL corresponding source for the Windows libmpv-2.dll ships with every release.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libmpv-windows
          path: libmpv-windows
      - name: Add the libmpv source bundle
        run: |
          version="$(node -p "require('./package.json').version")"
          cp libmpv-windows/libmpv-windows-x64-source.tar "release/Squiggly-Music-${version}-libmpv-windows-x64-source.tar"
      - run: node scripts/release-checksums.mjs release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: assemble
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build provenance
      attestations: write # store build provenance
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS
      # Artifact attestations need a public repository, or GitHub Enterprise Cloud for
      # private ones. Set the ATTEST_PRIVATE repository variable to "true" on Enterprise Cloud.
      - name: Attest build provenance
        id: attest
        if: github.event.repository.visibility == 'public' || vars.ATTEST_PRIVATE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ATTESTED: ${{ steps.attest.outcome == 'success' }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          sed -e "s|{{VERSION}}|$version|g" -e "s|{{TAG}}|$TAG|g" -e "s|{{REPO}}|$GH_REPO|g" \
            .github/release-notes-header.md > "$notes"
          if [ "$ATTESTED" != "true" ]; then
            sed -i '/<!-- attestation:start -->/,/<!-- attestation:end -->/d' "$notes"
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "Squiggly Music $version" \
            --notes-file "$notes" \
            --generate-notes \
            "${prerelease[@]}"
