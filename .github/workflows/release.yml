# Builds release packages and publishes a GitHub Release.
# - Push a tag `v<package.json version>` (made by `npm version`) to build and publish.
# - Run manually (workflow_dispatch) to build and download the packages as workflow
#   artifacts without publishing anything. Only tag builds are signed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Every Windows signature must be from a certificate with exactly this subject. The default is
  # SignPath Foundation's certificate; the SIGNPATH_EXPECTED_SUBJECT variable overrides it.
  SIGNPATH_EXPECTED_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SUBJECT || 'CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US' }}

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-24.04
    # Fedora provides mpv-libs, so the native libmpv decoding test runs instead of skipping.
    container: fedora:44
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Install system packages
        run: dnf -y install git-core tar zstd mpv-libs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Cut releases with npm version."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      # tests/native.test.ts forks the compiled audio host (out/main/player.js), so build first.
      - run: npm run build
      - run: npm run test:source
        env:
          SQUIGGLY_LIBMPV_PATH: /usr/lib64/libmpv.so.2

  # Playwright UI tests. They run on the Ubuntu runner, not the Fedora container, because
  # `playwright install --with-deps` installs browser dependencies with apt. Every step is
  # skipped until package.json has a test:ui script.
  ui:
    name: UI tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          CI: '1'
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the audio-only LGPL libmpv-2.dll and its corresponding-source bundle from the
  # pinned recipe in build/libmpv (see licenses/libmpv-windows/NOTICE.md). The output is
  # cached by the recipe's contents; on a cache hit build.mjs only re-verifies it. The
  # build is reproducible, and build.mjs fails unless the DLL matches the SHA-256 pinned in
  # build/libmpv/sources.json.
  libmpv:
    name: Windows libmpv (LGPL, from source)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache the libmpv build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/libmpv-windows
          key: libmpv-windows-${{ hashFiles('build/libmpv/**', 'scripts/fetch-common.mjs') }}
      # build.mjs uses only Node's standard library, so no npm ci. It runs the build in a
      # container with no network, after checking every source tarball's SHA-256.
      - name: Build or verify libmpv
        run: node build/libmpv/build.mjs
        env:
          SQUIGGLY_CONTAINER_ENGINE: docker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libmpv-windows
          path: .local/libmpv-windows/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux RPM
    needs: [check, ui]
    runs-on: ubuntu-24.04
    # rpmbuild, and libcrypt.so.1 for electron-builder's bundled fpm, come from Fedora packages.
    container: fedora:44
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Install system packages
        run: dnf -y install git-core tar zstd xz rpm-build libxcrypt-compat
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Caches only the downloaded archives. The fetch script rehashes them against the
      # digests pinned in the script on every run and rebuilds .local/linux-runtime from them.
      - name: Cache runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/downloads
          key: linux-downloads-${{ hashFiles('scripts/fetch-linux-runtime.mjs', 'scripts/fetch-common.mjs') }}
      - run: npm ci
      - run: npm run package:linux
      # Installs the RPM the way users do, so dnf resolves mpv-libs from its Requires, then
      # runs the installed audio host with its bundled Node against the system libmpv.
      - name: Install the RPM and smoke-test its audio runtime
        run: |
          dnf -y install ./dist/squiggly-music-*.x86_64.rpm
          "/opt/Squiggly Music/resources/runtime/node" scripts/smoke-runtime.mjs "/opt/Squiggly Music" --expect-system-libmpv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64
          path: |
            dist/*.rpm
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  # Windows signing goes through SignPath Foundation (CODE_SIGNING.md, docs/signing.md). Only
  # release tags (v*) are signed: a manual run from a branch builds unsigned files. Signing is also
  # skipped until the SIGNPATH_ORGANIZATION_ID variable is set, so releases are unsigned until then
  # rather than failing. Each signing request waits for an approver.
  # A signed release takes five jobs, so the SignPath token never reaches a runner that ran npm ci
  # or this repository's code: windows builds the app, windows-sign-app signs it,
  # windows-installers builds the installer and portable exe from the signed app,
  # windows-sign-installers signs those, and windows-release updates latest.yml and checks every
  # signature. The two signing jobs check nothing out; they only pass files to SignPath and back.
  windows:
    name: Windows installer and portable
    needs: [check, ui, libmpv]
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    outputs:
      unsigned-app: ${{ steps.unsigned-app.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Caches only the downloaded archives. The fetch script rehashes them against the
      # digests pinned in the script on every run and rebuilds .local/windows-runtime from them.
      - name: Cache runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/downloads
          key: windows-downloads-${{ hashFiles('scripts/fetch-windows-runtime.mjs', 'scripts/fetch-common.mjs') }}
      # fetch-windows-runtime.mjs checks this build against build/libmpv before packaging it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libmpv-windows
          path: .local/libmpv-windows
      - run: npm ci
      # The app first, so its own files are signed before they go into the installers. This builds
      # the installers too, and a signed release rebuilds them from the signed app: electron-builder
      # only writes resources/app-update.yml, which the updater reads, when it builds the NSIS
      # installer, not for --dir or --prepackaged.
      - name: Build the app
        run: npm run package:win
      # Runs the packaged audio host with the bundled node.exe, Koffi binary, and libmpv-2.dll,
      # and the unpacked esbuild binary.
      - name: Smoke-test the packaged audio runtime
        run: node scripts/smoke-runtime.mjs dist/win-unpacked
      # Unsigned builds ship these files as they are; a signed release uploads them from windows-release.
      - if: env.SIGN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
      # Signs the files this project builds: the app's exe and libmpv-2.dll. node.exe is signed
      # by the OpenJS Foundation; other third-party files are left as they came.
      - name: Upload the app for signing
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-app-unsigned
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 1

  windows-sign-app:
    name: Sign the Windows app
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # SignPath reads this run's jobs to verify where the files came from, and downloads them
    # Up to an hour waiting for approval.
    timeout-minutes: 70
    steps:
      - name: Sign the app
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: squiggly-music
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ needs.windows.outputs.unsigned-app }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-app-signed
          path: signed-app/
          if-no-files-found: error
          retention-days: 1

  windows-installers:
    name: Windows installer and portable, from the signed app
    needs: windows-sign-app
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      unsigned-installers: ${{ steps.unsigned-installers.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-app-signed
          path: dist/win-unpacked
      - name: Check the app's signatures
        shell: pwsh
        run: |
          foreach ($file in Get-Item 'dist/win-unpacked/Squiggly Music.exe', 'dist/win-unpacked/resources/runtime/libmpv-2.dll') {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($signature.Status)" }
            $subject = $signature.SignerCertificate.Subject
            if ($subject -cne $env:SIGNPATH_EXPECTED_SUBJECT) { throw "$($file.Name) is signed by '$subject', not '$env:SIGNPATH_EXPECTED_SUBJECT'" }
            "$($file.Name): $subject"
          }
      - name: Build the installer and portable exe
        run: npx electron-builder --win --prepackaged dist/win-unpacked --publish never
      - name: Upload the installer and portable exe for signing
        id: unsigned-installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installers-unsigned
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-update-metadata
          path: dist/latest.yml
          if-no-files-found: error
          retention-days: 1

  windows-sign-installers:
    name: Sign the Windows installer and portable
    needs: windows-installers
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # SignPath reads this run's jobs to verify where the files came from, and downloads them
    # Up to an hour waiting for approval.
    timeout-minutes: 70
    steps:
      - name: Sign the installer and portable exe
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: squiggly-music
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ needs.windows-installers.outputs.unsigned-installers }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installers-signed
          path: signed-installers/
          if-no-files-found: error
          retention-days: 1

  windows-release:
    name: Windows release files
    needs: windows-sign-installers
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # scripts/rehash-windows-update.mjs uses electron-builder's block map code.
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-update-metadata
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installers-signed
          path: dist
      # Signing changes the installer's bytes, so latest.yml and its block map are rebuilt.
      - name: Update the installer's metadata
        run: node scripts/rehash-windows-update.mjs dist
      - name: Check the signatures
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist/*.exe) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($signature.Status)" }
            $subject = $signature.SignerCertificate.Subject
            if ($subject -cne $env:SIGNPATH_EXPECTED_SUBJECT) { throw "$($file.Name) is signed by '$subject', not '$env:SIGNPATH_EXPECTED_SUBJECT'" }
            "$($file.Name): $subject"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  # linux and windows each fail before uploading if their packaged smoke test fails, so
  # assemble and publish only run on packages whose audio runtime started and decoded audio.
  # windows-release only runs for a signed release; otherwise windows uploads the Windows files.
  assemble:
    name: Collect assets and checksums
    needs: [linux, windows, windows-release, libmpv]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-x64'
          path: release
          merge-multiple: true
      # The LGPL corresponding source for the Windows libmpv-2.dll ships with every release.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libmpv-windows
          path: libmpv-windows
      - name: Add the libmpv source bundle
        run: |
          version="$(node -p "require('./package.json').version")"
          cp libmpv-windows/libmpv-windows-x64-source.tar "release/Squiggly-Music-${version}-libmpv-windows-x64-source.tar"
      - run: node scripts/release-checksums.mjs release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: assemble
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build provenance
      attestations: write # store build provenance
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS
      # Artifact attestations need a public repository, or GitHub Enterprise Cloud for
      # private ones. Set the ATTEST_PRIVATE repository variable to "true" on Enterprise Cloud.
      - name: Attest build provenance
        id: attest
        if: github.event.repository.visibility == 'public' || vars.ATTEST_PRIVATE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ATTESTED: ${{ steps.attest.outcome == 'success' }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          sed -e "s|{{VERSION}}|$version|g" -e "s|{{TAG}}|$TAG|g" -e "s|{{REPO}}|$GH_REPO|g" \
            .github/release-notes-header.md > "$notes"
          if [ "$ATTESTED" != "true" ]; then
            sed -i '/<!-- attestation:start -->/,/<!-- attestation:end -->/d' "$notes"
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "Squiggly Music $version" \
            --notes-file "$notes" \
            --generate-notes \
            "${prerelease[@]}"
