appId: dev.squiggly.music
productName: Squiggly Music
directories:
  output: dist
# The audio host runs under a separate Node executable, which cannot read asar archives.
asar: false
# Koffi ships prebuilt binaries and runs in the Node host, not Electron. Do not rebuild it.
npmRebuild: false
files:
  - out/**
  - package.json
  # The renderer bundles these; main and preload never load them.
  - '!node_modules/{react,react-dom,lucide-react,scheduler}/**'
# Third-party notices ship in resources/licenses on every platform. Electron's own
# LICENSE.electron.txt and LICENSES.chromium.html sit beside the executable.
extraResources:
  - from: THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: licenses/LICENSE.squiggly.txt
# Writes resources/licenses/npm-packages.txt and fails the build when a required notice
# is missing or a production dependency has an unreviewed license.
afterPack: ./scripts/release-notices.mjs
# Electron sets its Linux app_id / WM_CLASS from desktopName; the .desktop file matches it.
extraMetadata:
  desktopName: squiggly-music.desktop
  # Required by the Linux package metadata.
  homepage: https://github.com/parth-thakre/squiggly-music
# Release assets live on GitHub Releases. Scripts and CI pass --publish never and upload
# with the release workflow; this block only feeds electron-updater metadata
# (resources/app-update.yml, latest.yml, latest-linux.yml) for a future update check.
publish:
  provider: github
  owner: parth-thakre
  repo: squiggly-music
  releaseType: release
win:
  # Generated from apps/desktop/renderer/public/icon.svg by `npm run icons`.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  # Platform files replace the top-level list for the app directory, so repeat it.
  files:
    - out/**
    - package.json
    - '!node_modules/{react,react-dom,lucide-react,scheduler}/**'
    - '!node_modules/@koromix/koffi-{linux,darwin,freebsd,openbsd}-*/**'
    - from: .local/windows-runtime/koffi-win32-x64
      to: node_modules/@koromix/koffi-win32-x64
  extraResources:
    - from: .local/windows-runtime
      to: runtime
      filter: [node.exe, libmpv-2.dll, LICENSE.node.txt]
    # libmpv's GPL notices, build provenance, and written source offer.
    - from: licenses/libmpv-windows
      to: licenses/libmpv-windows
linux:
  target:
    - target: rpm
      arch: x64
  executableName: squiggly-music
  syncDesktopName: true
  # Generated from apps/desktop/renderer/public/icon.svg by `npm run icons`.
  icon: build/icons
  category: AudioVideo;Audio;Player
  synopsis: Audiophile-first desktop music player
  maintainer: Squiggly Music
  desktop:
    entry:
      StartupWMClass: squiggly-music
      Keywords: music;player;audio;navidrome;subsonic;mpv;
  # Platform files replace the top-level list for the app directory, so repeat it.
  files:
    - out/**
    - package.json
    - '!node_modules/{react,react-dom,lucide-react,scheduler}/**'
    # Keep only the linux-x64 glibc Koffi binary. The system provides libmpv.
    - '!node_modules/@koromix/koffi-{win32,darwin,freebsd,openbsd,android}-*/**'
    - '!node_modules/@koromix/koffi-linux-{arm,arm64,ia32,riscv64,loong64,ppc64}/**'
    - '!node_modules/@koromix/koffi-linux-x64/musl_x64/**'
  extraResources:
    - from: .local/linux-runtime
      to: runtime
      filter: [node, LICENSE.node.txt]
rpm:
  artifactName: squiggly-music-${version}.x86_64.${ext}
  # Electron defaults plus Fedora's libmpv (libmpv.so.2), loaded by the audio host.
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - mpv-libs
  fpm:
    # Avoid /usr/lib/.build-id conflicts with other Electron RPMs.
    - --rpm-rpmbuild-define=_build_id_links none
# Release asset names avoid spaces: GitHub rewrites them, which breaks latest.yml.
nsis:
  artifactName: Squiggly-Music-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: Squiggly-Music-${version}-windows-${arch}-portable.${ext}
