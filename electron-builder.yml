appId: dev.squiggly.music
productName: Squiggly Music
directories:
  output: dist
# The app ships in resources/app.asar: one file instead of thousands, which matters most for
# the portable build, which extracts the whole app on every launch.
asar: true
# Files that run outside Electron's asar support stay unpacked in app.asar.unpacked:
# - The audio host runs under the bundled Node executable, which cannot read asar. It loads
#   out/main/player.js, its chunks, and out/main/package.json ("type": "module"), then Koffi
#   and Koffi's platform binary. Keep this in step with what player.js imports:
#   scripts/smoke-runtime.mjs fails if the host can't start from app.asar.unpacked.
# - esbuild's native binary, which the extension loader spawns (ESBUILD_BINARY_PATH is set
#   in apps/desktop/main/extensions/electron.ts). esbuild's JavaScript stays in app.asar.
# Windows and macOS map the Koffi and esbuild binaries in from .local/windows-runtime and
# .local/macos-runtime/<arch> (see win.files, mac.files); asarUnpack matches those mapped
# copies by their source directory names.
asarUnpack:
  - out/main/**
  - node_modules/koffi/**
  - '**/node_modules/@koromix/koffi-*/**'
  - '**/node_modules/@esbuild/**'
  - '**/koffi-win32-x64/**'
  - '**/esbuild-win32-x64/**'
  - '**/koffi-darwin-*/**'
  - '**/esbuild-darwin-*/**'
# The UI is English-only. Chromium's other 54 locale packs are about 49 MB.
electronLanguages: [en-US]
# Koffi ships prebuilt binaries and runs in the Node host, not Electron. Do not rebuild it.
npmRebuild: false
files:
  - out/**
  - package.json
  # The renderer bundles these; main and preload never load them.
  - '!node_modules/{react,react-dom,lucide-react,scheduler}/**'
  # Source maps and effect's TypeScript sources are not loaded at run time.
  - '!node_modules/**/*.map'
  - '!node_modules/effect/src/**'
  # esbuild's install script copies the host's native binary here. Packages run the
  # @esbuild/<platform> binary through ESBUILD_BINARY_PATH instead.
  - '!node_modules/esbuild/bin/**'
# Third-party notices ship in resources/licenses on every platform. Electron's own
# LICENSE.electron.txt and LICENSES.chromium.html sit beside the executable, except on macOS,
# where they are in the bundle's Contents/Resources/licenses (see afterExtract).
extraResources:
  - from: THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: licenses/LICENSE.squiggly.txt
# Writes resources/licenses/npm-packages.txt and fails the build when a required notice
# is missing or a production dependency has an unreviewed license.
afterPack: ./scripts/release-notices.mjs
# macOS only: electron-builder deletes Electron's LICENSE and LICENSES.chromium.html from a macOS app,
# so this keeps copies in the bundle's resources/licenses before it does.
afterExtract: ./scripts/release-notices.mjs
# Electron fuses, flipped in the packaged executable after afterPack and before signing:
# - runAsNode stays on. The audio host is forked with the bundled Node in resources/runtime
#   as its execPath, but Electron's child_process.fork still depends on ELECTRON_RUN_AS_NODE:
#   with this fuse off the host starts and never answers ("Audio process is not running").
# - NODE_OPTIONS, NODE_EXTRA_CA_CERTS, and --inspect off, so neither the environment nor the
#   command line can load code into the main process.
# - Load the app only from app.asar, and check app.asar against the hash electron-builder
#   embeds in the app: in the Windows exe's resources, and in Info.plist (ElectronAsarIntegrity)
#   on macOS. Linux Electron has no asar integrity check, so there the fuse does nothing. Files
#   in app.asar.unpacked (asarUnpack above) are never checked.
electronFuses:
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# Electron sets its Linux app_id / WM_CLASS from desktopName; the .desktop file matches it.
extraMetadata:
  desktopName: squiggly-music.desktop
  # Required by the Linux package metadata.
  homepage: https://github.com/parth-thakre/squiggly-music
# Release assets live on GitHub Releases. Scripts and CI pass --publish never and upload
# with the release workflow; this block only feeds electron-updater metadata
# (resources/app-update.yml, latest.yml, latest-linux.yml, latest-mac.yml) for a future update check.
publish:
  provider: github
  owner: parth-thakre
  repo: squiggly-music
  releaseType: release
win:
  # Generated from apps/desktop/renderer/public/icon.svg by `npm run icons`.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  # Platform files replace the top-level list for the app directory, so repeat it.
  files:
    - out/**
    - package.json
    - '!node_modules/{react,react-dom,lucide-react,scheduler}/**'
    - '!node_modules/**/*.map'
    - '!node_modules/effect/src/**'
    - '!node_modules/esbuild/bin/**'
    # Koffi's and esbuild's win32-x64 binaries come from scripts/fetch-windows-runtime.mjs,
    # pinned to the lockfile's integrity, so a Linux host can build the Windows package.
    - '!node_modules/@koromix/koffi-{linux,darwin,freebsd,openbsd}-*/**'
    - '!node_modules/@esbuild/**'
    - from: .local/windows-runtime/koffi-win32-x64
      to: node_modules/@koromix/koffi-win32-x64
    - from: .local/windows-runtime/esbuild-win32-x64
      to: node_modules/@esbuild/win32-x64
  extraResources:
    - from: .local/windows-runtime
      to: runtime
      filter: [node.exe, libmpv-2.dll, LICENSE.node.txt]
    # libmpv's LGPL notice, component licenses, and where to get its source.
    - from: licenses/libmpv-windows
      to: licenses/libmpv-windows
linux:
  target:
    - target: rpm
      arch: x64
    - target: deb
      arch: x64
    - target: AppImage
      arch: x64
  executableName: squiggly-music
  syncDesktopName: true
  # Generated from apps/desktop/renderer/public/icon.svg by `npm run icons`.
  icon: build/icons
  category: AudioVideo;Audio;Player
  synopsis: Audiophile-first desktop music player
  maintainer: Squiggly Music
  desktop:
    entry:
      StartupWMClass: squiggly-music
      Keywords: music;player;audio;navidrome;subsonic;mpv;
  # Platform files replace the top-level list for the app directory, so repeat it.
  files:
    - out/**
    - package.json
    - '!node_modules/{react,react-dom,lucide-react,scheduler}/**'
    - '!node_modules/**/*.map'
    - '!node_modules/effect/src/**'
    - '!node_modules/esbuild/bin/**'
    # Keep only the linux-x64 glibc Koffi binary. The distribution provides libmpv: the RPM
    # and deb depend on it, and the AppImage needs it installed (docs/packaging.md).
    - '!node_modules/@koromix/koffi-{win32,darwin,freebsd,openbsd,android}-*/**'
    - '!node_modules/@koromix/koffi-linux-{arm,arm64,ia32,riscv64,loong64,ppc64}/**'
    - '!node_modules/@koromix/koffi-linux-x64/musl_x64/**'
    # Keep only esbuild's linux-x64 binary.
    - '!node_modules/@esbuild/{aix,android,darwin,freebsd,netbsd,openbsd,openharmony,sunos,win32}-*/**'
    - '!node_modules/@esbuild/linux-{arm,arm64,ia32,loong64,mips64el,ppc64,riscv64,s390x}/**'
  extraResources:
    - from: .local/linux-runtime
      to: runtime
      filter: [node, LICENSE.node.txt]
mac:
  # electron-builder makes the icns from this 1024 px master when it packages the app.
  icon: build/icon.png
  category: public.app-category.music
  # A dmg needs macOS; scripts/package-macos.mjs builds the zips only on other hosts. The updater
  # reads latest-mac.yml, which lists the zips.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned, like Windows. Squirrel.Mac needs a signed app to install an update, so the app only
  # says a new version is out (apps/desktop/main/updates.ts).
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Squiggly-Music-${version}-macos-${arch}.${ext}
  # Platform files replace the top-level list for the app directory, so repeat it.
  files:
    - out/**
    - package.json
    - '!node_modules/{react,react-dom,lucide-react,scheduler}/**'
    - '!node_modules/**/*.map'
    - '!node_modules/effect/src/**'
    - '!node_modules/esbuild/bin/**'
    # Koffi's and esbuild's darwin binaries come from scripts/fetch-macos-runtime.mjs, pinned to the
    # lockfile's integrity, so a Linux host can build the macOS package. One CPU per build.
    - '!node_modules/@koromix/koffi-*/**'
    - '!node_modules/@esbuild/**'
    - from: .local/macos-runtime/${arch}/koffi-darwin-${arch}
      to: node_modules/@koromix/koffi-darwin-${arch}
    - from: .local/macos-runtime/${arch}/esbuild-darwin-${arch}
      to: node_modules/@esbuild/darwin-${arch}
  extraResources:
    # The audio host's Node. libmpv is not bundled: the host loads Homebrew's or MacPorts'.
    - from: .local/macos-runtime/${arch}
      to: runtime
      filter: [node, LICENSE.node.txt]
dmg:
  # The updater needs only the zips.
  writeUpdateInfo: false
rpm:
  artifactName: squiggly-music-${version}.x86_64.${ext}
  # Electron defaults plus Fedora's libmpv (libmpv.so.2), loaded by the audio host.
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - mpv-libs
  fpm:
    # Avoid /usr/lib/.build-id conflicts with other Electron RPMs.
    - --rpm-rpmbuild-define=_build_id_links none
deb:
  artifactName: squiggly-music_${version}_amd64.${ext}
  # Section: sound, instead of fpm's "default".
  packageCategory: sound
  # electron-builder's deb list (Electron's libraries, and libsecret for safeStorage), then
  # Debian's and Ubuntu's libmpv: libmpv2 from Debian 12 and Ubuntu 24.04, libmpv1 before.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libmpv2 | libmpv1
# An AppImage can't depend on packages and doesn't bundle libmpv. The audio host loads the
# system's, and says which package to install when there is none.
appImage:
  artifactName: Squiggly-Music-${version}-x86_64.${ext}
  # The default adds --no-sandbox to the desktop entry. AppRun adds it by itself when the
  # system doesn't allow the user namespaces Chromium's sandbox needs.
  executableArgs: []
# Release asset names avoid spaces: GitHub rewrites them, which breaks latest.yml.
nsis:
  artifactName: Squiggly-Music-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: Squiggly-Music-${version}-windows-${arch}-portable.${ext}
