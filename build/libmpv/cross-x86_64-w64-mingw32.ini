# Meson cross file for build.sh. The win32 thread-model GCC avoids linking winpthreads.
[binaries]
c = 'x86_64-w64-mingw32-gcc-win32'
cpp = 'x86_64-w64-mingw32-g++-win32'
ar = 'x86_64-w64-mingw32-gcc-ar-win32'
nm = 'x86_64-w64-mingw32-gcc-nm-win32'
ranlib = 'x86_64-w64-mingw32-gcc-ranlib-win32'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
dlltool = 'x86_64-w64-mingw32-dlltool'
pkg-config = 'pkgconf'
nasm = 'nasm'

[properties]
pkg_config_libdir = '/build/prefix/lib/pkgconfig'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
