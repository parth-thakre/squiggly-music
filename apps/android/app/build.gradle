apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// The app's version is the repository's (package.json). 0.1.0 is version code 100.
def packageVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json')).version as String
def versionParts = packageVersion.tokenize('.-')
def packageVersionCode = versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()

// Release signing comes from a properties file outside the repository (storeFile, storePassword,
// keyAlias, keyPassword), named by SQUIGGLY_ANDROID_SIGNING. Without one, the release APK is
// left unsigned. See docs/android.md.
def signingFile = System.getenv('SQUIGGLY_ANDROID_SIGNING')
def signing = new Properties()
if (signingFile) file(signingFile).withInputStream { signing.load(it) }

android {
    namespace = "dev.squiggly.music"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.squiggly.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode packageVersionCode
        versionName packageVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingFile) {
            release {
                storeFile file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingFile) signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig = true
    }
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.window:window:$windowVersion"
    implementation "androidx.window:window-java:$windowVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
